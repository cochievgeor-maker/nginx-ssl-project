name: PR Validation

on:
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose syntax
        run: docker compose -f deploy/docker-compose.yml config

      - name: Build and start services
        run: |
          cd deploy
      - name: Generate test certificates
        run: |
          mkdir -p certs
          openssl req -x509 -nodes -days 1 \
            -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout certs/server.key \
            -out certs/server.crt \
            -subj "/CN=localhost/O=CI/C=RU"
          chmod 644 certs/server.key
          docker compose up -d --build

      - name: Wait for healthcheck
        run: sleep 20

      - name: Run integration tests (conditional)
        run: |
          cd deploy
          if [ -f scripts/tests/run_all_tests.sh ]; then
            bash scripts/tests/run_all_tests.sh || exit 1
          else
            echo "Tests not found yet. CI will enforce them after SysAdmin pushes."
          fi
          docker compose down
