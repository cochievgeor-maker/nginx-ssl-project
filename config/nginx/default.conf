# @file config/nginx/default.conf
# @brief Nginx vhost: HTTP->HTTPS redirect, TLSv1.3, HTTP/2, security headers, split logs
# @author Кочиев Георгий Джамболатович (kochiev@sfedu.ru)
# @date 2026-05-25
# @version 1.0.0

# HTTP-блок: только перманентный редирект 301
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS-блок: основной защищённый сервис
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name localhost;

    # Сертификаты через Docker Secrets
    ssl_certificate /run/secrets/nginx_cert;
    ssl_certificate_key /run/secrets/nginx_key;

    # Современные TLS-параметры
    ssl_protocols TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 🛡️аголовки безопасности (требование ТЗ)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Разделение логов
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
