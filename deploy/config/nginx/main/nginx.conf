# @file config/nginx/main/nginx.conf
# @brief Глобальные настройки Nginx: воркеры, логирование, подключение vhost
# @author Кочиев Георгий Джамболатович (kochiev@sfedu.ru)
# @date 2026-05-25
# @version 1.1.0
# @license MIT

# Директива user — ТОЛЬКО в главном конфиге
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # HTTP/2 включается на уровне http (более новый протокол в Nginx 1.25+)
    http2 on;

    # Подключение виртуальных хостов
    include /etc/nginx/conf.d/*.conf;
}
