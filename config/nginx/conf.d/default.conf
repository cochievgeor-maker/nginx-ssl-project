# @file config/nginx/conf.d/default.conf
# @brief Minimal vhost for CI validation (placeholder)
# @author Кочиев Георгий Джамболатович (kochiev@sfedu.ru)
# @date 2026-05-25
# @version 0.1.0 (placeholder - to be replaced by SysAdmin)

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;
    
    ssl_certificate /run/secrets/nginx_cert;
    ssl_certificate_key /run/secrets/nginx_key;
    ssl_protocols TLSv1.3;
    
    root /usr/share/nginx/html;
    index index.html;
    
    location / {
        try_files $uri $uri/ =404;
    }
}
