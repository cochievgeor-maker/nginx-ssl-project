name: PR Validation

on:
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose syntax
        run: docker compose -f deploy/docker-compose.yml config

      - name: Build and start services
        run: |
          cd deploy
          docker compose up -d --build

      - name: Wait for healthcheck
        run: sleep 20

      - name: Run integration tests (conditional)
        run: |
          cd deploy
          if [ -f scripts/tests/run_all_tests.sh ]; then
            bash scripts/tests/run_all_tests.sh || exit 1
          else
            echo "Tests not found yet. CI will enforce them after SysAdmin pushes."
          fi
          docker compose down
