# @file config/nginx/conf.d/default.conf
# @brief Nginx vhost: HTTP->HTTPS redirect, TLSv1.3, security headers, split logs
# @author Кочиев Георгий Джамболатович (kochiev@sfedu.ru)
# @date 2026-05-25
# @version 1.1.0
# @license MIT

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS server (ТЗ п.3.2 + 3.3)
server {
    listen 443 ssl;
    server_name localhost;

    # TLS 1.3 (ТЗ п.3.2)
    ssl_certificate     /run/secrets/nginx_cert;
    ssl_certificate_key /run/secrets/nginx_key;
    ssl_protocols       TLSv1.3;

    # Security headers (ТЗ п.3.3)
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
